name: Gen Android Keystore

# [AI-2026-11-15] 一次性工具：在 CI 里用 keytool 生成 Java 原生 PKCS12 keystore，
# 避免 OpenSSL 3 生成的文件 Java 17 读不了（报 keystore password was incorrect）。
# 用完即删。

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'keystore 密码（至少 6 位，记牢，之后要填进 secrets）'
        required: true
        default: 'oasx2026'

permissions:
  contents: read

jobs:
  gen:
    name: Generate keystore
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore with keytool
        shell: bash
        run: |
          set -euo pipefail
          PW='${{ inputs.password }}'
          echo "::add-mask::$PW"
          keytool -genkeypair -v \
            -keystore keystore.p12 -storetype PKCS12 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias oasx \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=OASX, OU=Dev, O=OASX, L=CN, C=CN"
          base64 -w0 keystore.p12 > keystore.b64
          echo "keystore bytes: $(stat -c%s keystore.p12)"
          echo "base64 chars: $(wc -c < keystore.b64)"
          keytool -list -keystore keystore.p12 -storetype PKCS12 -storepass "$PW" -alias oasx

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore
          path: |
            keystore.p12
            keystore.b64
          retention-days: 3
